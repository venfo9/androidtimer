name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Runners are ephemeral, so without this every build gets a fresh, differently-signed
      # debug key — Android then refuses to install an update over the previous run's APK
      # (signature mismatch), forcing an uninstall that wipes all local app data. Caching the
      # keystore, created on first run and reused after, keeps every build's signature stable.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkBreakTimer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
